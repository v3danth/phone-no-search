[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonelookup"
version = "0.1.0"
description = "Offline, numverify-style phone number facts with optional live HLR, block probing, and OSINT helpers."
requires-python = ">=3.9"
dependencies = ["phonenumbers==9.0.42"]

[project.scripts]
phonelookup = "phonelookup.cli:main"

[tool.setuptools]
packages = ["phonelookup", "phonelookup.providers"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # ternary-vs-if is a readability call, left to the author

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true   # phonenumbers ships no type stubs
warn_unused_ignores = true
